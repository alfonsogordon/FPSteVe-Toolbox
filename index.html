<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><meta name="description" content="FPSteVe's own FPV web apps and projects"><title>FPSteVe Toolbox</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f2f2;background:#151515}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;gap:16px;margin-bottom:35px}.mark{background:#292929;color:#f5f5f5;padding:16px;border-radius:18px;font-size:26px}h1{margin:0;font-size:clamp(28px,5vw,43px)}p{color:#a8b9c6}.lead{margin:5px 0}.tools{display:flex;margin:24px 0}input{width:100%;background:#222;border:1px solid #444;border-radius:12px;padding:13px;color:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:#202020;border:1px solid #3b3b3b;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:215px}.card h2{font-size:19px;margin:0}.card p{margin:0;flex:1;line-height:1.5}.tag{font-size:12px;color:#bcbcbc}.links{display:flex;gap:10px;flex-wrap:wrap}a{color:#111;background:#f1f1f1;border-radius:9px;text-decoration:none;padding:9px 12px;font-weight:650;font-size:13px}a.secondary{background:#353535;color:#f0f0f0}.empty{display:none}footer{padding-top:35px;font-size:13px;color:#aaa}
.logo{width:88px;height:88px;object-fit:cover;border-radius:50%;border:2px solid #444;flex-shrink:0}a:hover{filter:brightness(.88)}@media(max-width:500px){.logo{width:66px;height:66px}header{gap:12px}}</style></head><body><main><header><img class="logo" src="logo.png" alt="FPSteVe FPV logo" onerror="this.style.display='none'"><div><h1>FPSteVe Toolbox</h1><p class="lead">My FPV web apps & projects. One place, no clutter.</p></div></header><section class="grid" id="grid"></section><p class="empty" id="empty">No matching apps.</p><footer>Made for the field · FPSteVe Toolbox V1</footer></main>
<script>
const apps=[
{name:'FPV CamBuddy',category:'Camera control',description:'Wireless camera control between your action camera and FPV flight controller.',repo:'https://github.com/alfonsogordon/FPV-CamBuddy',site:'https://alfonsogordon.github.io/FPV-CamBuddy/flash.html'},
{name:'Betaflight Throttle Converter',category:'Flight utilities',description:'Convert throttle expo settings between older and newer Betaflight versions.',repo:'https://github.com/alfonsogordon/bf-throttle-converter',site:'https://alfonsogordon.github.io/bf-throttle-converter/'},
{name:'Blackbox Stick Overlay',category:'Video & logs',description:'Create animated stick position overlays for FPV videos using Betaflight Blackbox logs.',repo:'https://github.com/alfonsogordon/Blackbox-Stick-Overlay',site:'https://alfonsogordon.github.io/Blackbox-Stick-Overlay/'},
{name:'V12 Max RGB LED Scripts',category:'Radio & LEDs',description:'Custom throttle and stick-reactive RGB lighting for the HelloRadioSky V12 Max radio.',repo:null,site:'./v12-led.html'}
];
const grid=document.querySelector('#grid'),empty=document.querySelector('#empty');
function render(){const matches=apps;grid.replaceChildren();for(const a of matches){const c=document.createElement('article');c.className='card';const tag=document.createElement('span');tag.className='tag';tag.textContent=a.category;const h=document.createElement('h2');h.textContent=a.name;const p=document.createElement('p');p.textContent=a.description;const links=document.createElement('div');links.className='links';const repo=document.createElement('a');repo.href=a.repo;repo.target='_blank';repo.rel='noopener noreferrer';repo.textContent='GitHub ↗';if(a.repo)links.append(repo);if(a.site){const site=document.createElement('a');site.href=a.site;site.target='_blank';site.rel='noopener noreferrer';site.textContent=a.name.startsWith('V12')?'View guide ↗':'Open app ↗';links.prepend(site);repo.className='secondary'}c.append(tag,h,p,links);grid.append(c)}empty.style.display=matches.length?'none':'block'}render();
</script></body></html>

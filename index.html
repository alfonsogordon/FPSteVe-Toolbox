<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><meta name="description" content="FPSteVe's own FPV web apps and projects"><title>FPSteVe Toolbox</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf4f8;background:#101923}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;gap:16px;margin-bottom:35px}.mark{background:#233e48;color:#8ee3d4;padding:16px;border-radius:18px;font-size:26px}h1{margin:0;font-size:clamp(28px,5vw,43px)}p{color:#a8b9c6}.lead{margin:5px 0}.tools{display:flex;margin:24px 0}input{width:100%;background:#1e2d3b;border:1px solid #35495b;border-radius:12px;padding:13px;color:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:#1b2a37;border:1px solid #334554;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:215px}.card h2{font-size:19px;margin:0}.card p{margin:0;flex:1;line-height:1.5}.tag{font-size:12px;color:#9cdbd0}.links{display:flex;gap:10px;flex-wrap:wrap}a{color:#101923;background:#92e1d3;border-radius:9px;text-decoration:none;padding:9px 12px;font-weight:650;font-size:13px}a.secondary{background:#304557;color:#e2f0f6}.empty{display:none}footer{padding-top:35px;font-size:13px;color:#8396a5}
</style></head><body><main><header><div class="mark">✦</div><div><h1>FPSteVe Toolbox</h1><p class="lead">My FPV web apps & projects. One place, no clutter.</p></div></header><div class="tools"><input id="search" type="search" placeholder="Search my apps…" aria-label="Search apps"></div><section class="grid" id="grid"></section><p class="empty" id="empty">No matching apps.</p><footer>Made for the field · FPSteVe Toolbox V1</footer></main>
<script>
const apps=[
{name:'FPV CamBuddy',category:'Camera control',description:'Camera control project and its web tools.',repo:'https://github.com/alfonsogordon/FPV-CamBuddy',site:null},
{name:'Betaflight Throttle Converter',category:'Flight utilities',description:'Custom Betaflight throttle conversion utility.',repo:'https://github.com/alfonsogordon/bf-throttle-converter',site:null},
{name:'Blackbox Stick Overlay',category:'Video & logs',description:'Blackbox-driven stick position overlay project.',repo:'https://github.com/alfonsogordon/Blackbox-Stick-Overlay',site:null}
];
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),empty=document.querySelector('#empty');
function render(){const q=search.value.toLowerCase().trim(),matches=apps.filter(a=>(a.name+' '+a.category+' '+a.description).toLowerCase().includes(q));grid.replaceChildren();for(const a of matches){const c=document.createElement('article');c.className='card';const tag=document.createElement('span');tag.className='tag';tag.textContent=a.category;const h=document.createElement('h2');h.textContent=a.name;const p=document.createElement('p');p.textContent=a.description;const links=document.createElement('div');links.className='links';const repo=document.createElement('a');repo.href=a.repo;repo.target='_blank';repo.rel='noopener noreferrer';repo.textContent='GitHub project ↗';links.append(repo);if(a.site){const site=document.createElement('a');site.href=a.site;site.target='_blank';site.rel='noopener noreferrer';site.textContent='Open web app ↗';links.prepend(site);repo.className='secondary'}c.append(tag,h,p,links);grid.append(c)}empty.style.display=matches.length?'none':'block'}search.addEventListener('input',render);render();
</script></body></html>
